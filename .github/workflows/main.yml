name: Deploy React (Vite, Material UI) on Push
on:
  push:
    branches:
      - main # Or your main branch name
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: 'karan-resume/yarn.lock'
          
      - name: Install dependencies
        run: |
          cd karan-resume
          yarn install
          
      - name: Build with Vite (Production build)
        run: |
          cd karan-resume
          yarn build
          
      - name: Create CNAME file
        run: |
          cd karan-resume
          echo karanshukla.ca > build/CNAME
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./karan-resume/build
          cname: karanshukla.ca