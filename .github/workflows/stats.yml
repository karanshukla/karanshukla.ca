name: Update Site Stats

# Runs weekly: measures test coverage and Lighthouse scores, commits
# stats.json, then builds and deploys the site independently of main.yml.

permissions:
  contents: write
  pages: write
  id-token: write

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: main # Always build from the live tip of main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      # Phase 1: Code coverage
      - name: Run tests with coverage
        run: yarn test:coverage

      # Phase 2 & 3: Lighthouse (accessibility, performance, CWV)
      - name: Build with Vite (for Lighthouse measurement)
        run: yarn build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse
        run: |
          lhci collect \
            --staticDistDir=./build \
            --numberOfRuns=1 \
            --settings.chromeFlags="--no-sandbox --disable-dev-shm-usage" \
          || echo "[stats] lighthouse failed, will keep previous values"

      - name: Generate stats.json
        run: python3 scripts/generate_stats.py

      - name: Commit stats.json if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/stats.json
          git diff --staged --quiet || git commit -m 'chore: update site stats [skip ci]'
          git push

      # Rebuild so the deployed site includes the freshly committed stats.json
      - name: Build with Vite (with fresh stats.json)
        run: yarn build

      - name: Create CNAME file
        run: echo "karanshukla.ca" > build/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847  # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: karanshukla.ca
