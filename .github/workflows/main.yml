name: Deploy React (Vite, Material UI) on Push
on:
  push:
    branches:
      - main # Or your main branch name
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: 'karan-resume/yarn.lock'
          
      - name: Install dependencies
        run: |
          cd karan-resume
          yarn install
          
      - name: Build with Vite (Production build)
        run: |
          cd karan-resume
          yarn build
          
      - name: Create CNAME file
        run: |
          cd karan-resume
          # Debug - list directories to verify build output
          ls -la
          
          # Check if dist directory exists
          if [ -d "dist" ]; then
            echo "dist directory found, creating CNAME file"
            echo karanshukla.ca > dist/CNAME
          else
            echo "dist directory not found. Checking current working directory:"
            pwd
            echo "Listing all files and directories:"
            ls -la
            exit 1
          fi
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./karan-resume/dist
          cname: karanshukla.ca