name: Update GitHub Pulse

# Runs every 3 days: generates an LLM summary of recent commits, commits
# pulse.json, then builds and deploys the site independently of main.yml.

permissions:
  contents: write
  pages: write
  id-token: write

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: main # Always build from the live tip of main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate pulse summary
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/summarize.py

      - name: Commit pulse.json if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/pulse.json
          git diff --staged --quiet || git commit -m 'chore: update github pulse [skip ci]'
          git push

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Build with Vite
        run: yarn build

      - name: Create CNAME file
        run: echo "karanshukla.ca" > build/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847  # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: karanshukla.ca
