name: Update now playing

# Every 5 minutes: reads the latest YouTube Music history entry and, if it changed,
# force-pushes now-playing.json as a single orphan commit to the `now-playing` branch.
# NowPlayingWidget fetches it from raw.githubusercontent.com, so main never redeploys.

permissions:
  contents: write

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: now-playing
  cancel-in-progress: true

jobs:
  now-playing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Install ytmusicapi
        run: pip install --quiet ytmusicapi==1.12.4 requests

      - name: Load previous now-playing.json
        run: |
          git fetch --quiet --depth=1 origin now-playing \
            && git show FETCH_HEAD:now-playing.json > now-playing.json \
            || echo 'No previous now-playing.json'

      - name: Read YouTube Music history
        id: fetch
        env:
          YTMUSIC_OAUTH_TOKEN: ${{ secrets.YTMUSIC_OAUTH_TOKEN }}
          YTMUSIC_CLIENT_ID: ${{ secrets.YTMUSIC_CLIENT_ID }}
          YTMUSIC_CLIENT_SECRET: ${{ secrets.YTMUSIC_CLIENT_SECRET }}
        run: python3 scripts/fetch_youtube_music.py now-playing.json

      - name: Publish to the now-playing branch
        if: steps.fetch.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish_dir=$(mktemp -d)
          cp now-playing.json "$publish_dir/"
          cd "$publish_dir"
          git init --quiet --initial-branch=now-playing
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add now-playing.json
          git commit --quiet -m 'chore: update now playing'
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" now-playing
