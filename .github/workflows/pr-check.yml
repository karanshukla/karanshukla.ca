name: PR Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: 'karan-resume/yarn.lock'

      - name: Install dependencies
        run: |
          cd karan-resume
          yarn install

      - name: Type-check and build
        run: |
          cd karan-resume
          yarn build

      - name: Run tests
        run: |
          cd karan-resume
          yarn test:run
